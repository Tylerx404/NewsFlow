name: NewsFlow

services:
  postgres:
    image: postgres
    container_name: NewsFlow-postgres
    environment:
      POSTGRES_DB: NewsFlow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - NewsFlow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis
    container_name: NewsFlow-redis
    ports:
      - "6379:6379"
    volumes:
      - NewsFlow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  NewsFlow_postgres_data:
  NewsFlow_redis_data:
